  <text x="84" y="97" fill="#fdf6e3" font-family="Arial, sans-serif" font-size="38" font-weight="700" text-anchor="middle">₿</text>
  <text x="132" y="76" fill="#fdf6e3" font-family="monospace" font-size="22" font-weight="700" letter-spacing="4">PRICEB.TC</text>
