  <text x="66" y="292" fill="#cb4b16" font-family="Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="-3">WIDGETS.</text>
  <text x="68" y="346" fill="#93a1a1" font-family="Arial, sans-serif" font-size="25">Website embeds + transparent OBS overlays.</text>
