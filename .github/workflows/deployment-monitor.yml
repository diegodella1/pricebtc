name: Production deployment monitor

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check publication status and public health
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/deployment-github.mjs monitor

